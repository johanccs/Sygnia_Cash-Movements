services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "@1Mops4moa"
    ports:
      - "1433:1433"
    volumes:
      - sqlserver-data:/var/opt/mssql

  seq:
    image: datalust/seq:latest
    environment:
      ACCEPT_EULA: "Y"
      SEQ_FIRSTRUN_NOAUTHENTICATION: "true" # local dev only — no admin password needed
    ports:
      - "5341:80" # UI + ingestion, matches Seq:ServerUrl in appsettings.json
    volumes:
      - seq-data:/data

  jaeger:
    image: jaegertracing/all-in-one:latest
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
    ports:
      - "16686:16686" # UI
      - "4317:4317"   # OTLP gRPC, matches Otlp:Endpoint in appsettings.json

  presentation:
    build:
      context: .
      dockerfile: src/Sygnia.Backend/src/Sygnia.Presentation/Dockerfile
    image: ${DOCKERHUB_USER:-sygnia}/sygnia-presentation:latest
    depends_on:
      - sqlserver
      - seq
      - jaeger
    environment:
      ConnectionStrings__SygniaCash: "Server=sqlserver;Database=sygnia_cash;User Id=sa;Password=@1Mops4moa;TrustServerCertificate=True;"
      Seq__ServerUrl: "http://seq:80"
      Otlp__Endpoint: "http://jaeger:4317"
    ports:
      - "8080:8080"

  frontend:
    build:
      context: .
      dockerfile: src/Sygnia.Frontend/Dockerfile
    image: ${DOCKERHUB_USER:-sygnia}/sygnia-frontend:latest
    depends_on:
      - presentation
    environment:
      # run-local.ps1 overrides this to http://localhost:5058 (native Presentation);
      # run-dockerhub.ps1 leaves the default, matching the `presentation` container's
      # published port below.
      GRPC_URL: ${GRPC_URL:-http://localhost:8080}
    ports:
      - "4200:80"

volumes:
  sqlserver-data:
  seq-data:
