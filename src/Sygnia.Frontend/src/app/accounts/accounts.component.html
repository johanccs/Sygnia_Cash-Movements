<div class="container py-5">
  <h1 class="display-6 fw-bold mb-4">Create Account</h1>

  <form [formGroup]="form" (ngSubmit)="onSubmit()" class="col-md-6">
    <div class="mb-3">
      <label for="accountId" class="form-label">Account Id</label>
      <input id="accountId" type="text" class="form-control" formControlName="accountId" />
    </div>

    <div class="mb-3">
      <label for="accountName" class="form-label">Account Name</label>
      <input id="accountName" type="text" class="form-control" formControlName="accountName" />
    </div>

    <div class="mb-3">
      <label for="contactPerson" class="form-label">Contact Person</label>
      <input id="contactPerson" type="text" class="form-control" formControlName="contactPerson" />
    </div>

    <div class="mb-3">
      <label for="currency" class="form-label">Currency</label>
      <input id="currency" type="text" class="form-control" formControlName="currency" maxlength="3" minlength="3" />
    </div>

    <div class="mb-3">
      <label for="createdBy" class="form-label">Created By</label>
      <input id="createdBy" type="text" class="form-control" formControlName="createdBy" />
    </div>

    <button type="submit" class="btn btn-primary" [disabled]="form.invalid">Create Account</button>
  </form>

  @if (createdAccount) {
    <div class="alert alert-success mt-4" role="alert">
      Account created: <strong>{{ createdAccount.accountId }}</strong> ({{ createdAccount.accountName }})
    </div>
  }

  @if (errorMessage) {
    <div class="alert alert-danger mt-4" role="alert">
      {{ errorMessage }}
    </div>
  }
</div>
