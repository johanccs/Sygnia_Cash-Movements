<div class="container py-5">
  <div class="p-5 mb-4 bg-body-tertiary rounded-3">
    <div class="container-fluid py-3">
      <h1 class="display-5 fw-bold">Sygnia Cash Movements</h1>
      <p class="col-md-8 fs-4">
        Submit movements, transfer funds between accounts, and review balances and statements.
      </p>
    </div>
  </div>

  <div class="row g-4">
    <div class="col-md-4">
      <a routerLink="/accounts" class="text-decoration-none">
        <div class="ledger-card h-100">
          <h5 class="card-title">Accounts</h5>
          <p class="card-text text-body-secondary mb-0">Create and manage accounts.</p>
        </div>
      </a>
    </div>
    <div class="col-md-4">
      <a routerLink="/movement" class="text-decoration-none">
        <div class="ledger-card h-100">
          <h5 class="card-title">Movements</h5>
          <p class="card-text text-body-secondary mb-0">Submit deposits, withdrawals, and transfers.</p>
        </div>
      </a>
    </div>
    <div class="col-md-4">
      <a routerLink="/statement" class="text-decoration-none">
        <div class="ledger-card h-100">
          <h5 class="card-title">Statements</h5>
          <p class="card-text text-body-secondary mb-0">Check balances and browse account statements.</p>
        </div>
      </a>
    </div>
  </div>
</div>
