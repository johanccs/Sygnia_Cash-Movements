<div class="statement-preview">
  <div class="d-flex justify-content-end mb-2">
    <button type="button" class="btn btn-outline-secondary btn-sm download-pdf" (click)="downloadPdf()">
      Download PDF
    </button>
  </div>

  <table class="table table-striped table-sm">
    <thead>
      <tr>
        <th scope="col">Date</th>
        <th scope="col">External Ref</th>
        <th scope="col">Currency</th>
        <th scope="col">Amount</th>
        <th scope="col">Narration</th>
      </tr>
    </thead>
    <tbody>
      @for (line of lines(); track line.movement?.externalRef) {
        <tr>
          <td>{{ line.movement?.occurredAt | date: 'yyyy-MM-dd' }}</td>
          <td>{{ line.movement?.externalRef }}</td>
          <td>{{ line.movement?.currency }}</td>
          <td>{{ line.movement?.amount }}</td>
          <td>{{ line.movement?.narration }}</td>
        </tr>
      }
    </tbody>
  </table>
</div>
