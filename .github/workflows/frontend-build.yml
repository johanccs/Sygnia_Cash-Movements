name: Frontend Build

on:
  push:
    branches: [main]
    paths:
      - 'src/Sygnia.Frontend/**'
      - '.github/workflows/frontend-build.yml'
  pull_request:
    paths:
      - 'src/Sygnia.Frontend/**'
      - '.github/workflows/frontend-build.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Angular 18 requires Node 18.19+/20.11+; 20 LTS covers both.
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: src/Sygnia.Frontend/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: src/Sygnia.Frontend

      - name: Build
        run: npm run build
        working-directory: src/Sygnia.Frontend
